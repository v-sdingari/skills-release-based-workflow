<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="base.css" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <main id="container">
      <section class="todo-app" aria-label="To-do list application">
        <h1>To-Do List</h1>
        <form id="todo-form" novalidate>
          <label for="todo-input" class="sr-only">New task</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="Add a task"
            autocomplete="off"
          />
          <button type="submit">Add</button>
        </form>
        <p id="input-error" class="message error" aria-live="polite"></p>
        <ul id="todo-list" aria-live="polite"></ul>
        <p id="empty-state" class="message">No tasks yet. Add your first task.</p>
      </section>
    </main>
    <script src="todo.js"></script>
  </body>
</html>
